<div data-properties-surface="modal" class="modal-panel cw-jev-modal" role="dialog" aria-modal="true" aria-labelledby="jev-modal-title" data-generic-block-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="jev">
  <header class="modal-header">
    <div><span class="panel-kicker">Jev</span><h2 id="jev-modal-title">{{ node_title }}</h2></div>
    <button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button>
  </header>
  <div class="jev-modal-body">
    <nav class="jev-modal-tablist" role="tablist" aria-label="Jev">{{ tabs }}</nav>
    <div class="jev-modal-panels">{{ panels }}</div>
  </div>
  <footer class="jev-modal-footer">
    <span class="field-hint" data-i18n="block.jev.apply_hint">Changes remain local until you apply them.</span>
    <div class="modal-actions"><button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.cancel">Cancel</button><button class="solid-btn" data-block-apply type="button" disabled data-i18n="ui.block_kit.apply">Apply</button></div>
  </footer>
</div>
